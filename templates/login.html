{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BYTE ME Blue Team Portal</title>
    <meta name="theme-color" content="#020617">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <main class="login-container">
        <div class="login-card custom-card p-4 p-sm-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;" aria-hidden="true"></i>
                <h1 class="mt-3 mb-2 h3 fw-bold">BYTE ME Cyber Defense</h1>
                <p class="text-secondary mb-0">Blue Team Portal</p>
            </div>

            <form method="post" action="{% url 'login' %}" novalidate>
                {% csrf_token %}
                {% if messages %}
                    <div class="alert-stack" aria-live="polite" aria-atomic="false">
                        {% for message in messages %}
                            {% ifchanged message.tags message %}
                                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert" data-alert-text="{{ message|striptags }}" {% if message.tags != 'error' %}data-autohide="true"{% endif %}>
                                    <div class="alert-content">{{ message }}</div>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss message"></button>
                                </div>
                            {% endifchanged %}
                        {% endfor %}
                    </div>
                {% endif %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username…" autocomplete="username" spellcheck="false" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password…" autocomplete="current-password" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
